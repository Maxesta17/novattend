<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Evita fuga del token de sesion por la cabecera Referer hacia terceros. -->
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="/logova1.png" />
    <link rel="apple-touch-icon" href="/logova1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#800000">
    <title>NovAttend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Solo los pesos realmente usados en la app (auditoria: Cinzel siempre va con semibold/bold; Montserrat usa normal/medium/semibold/bold). -->
    <!-- crossorigin es imprescindible: sin el, el CSS llega como respuesta opaca (no-cors) y el service worker no puede cachearlo -> sin fuentes en modo offline. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
